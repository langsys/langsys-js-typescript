name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Build BEFORE test, deliberately: tests/no-private-fields.test.ts asserts
      # on dist, which is what Proxy-based bindings actually consume. With the
      # old order CI had no dist and that assertion was a permanent no-op.
      - run: npm run build

      # Every test that needs no SDK test clone. The contract tier runs against a real
      # Langsys API seeded before the run (TESTING.md, contract-fixture/README.md), which
      # GitHub does not have, and a contract test throws without one rather than passing
      # by skipping. vitest.config.ts lists those files once; `npm test` runs them too.
      - run: npm run test:no-clone
