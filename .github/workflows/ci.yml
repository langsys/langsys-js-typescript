name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Build BEFORE test, deliberately: tests/no-private-fields.test.ts asserts
      # on dist, which is what Proxy-based bindings actually consume. With the
      # old order CI had no dist and that assertion was a permanent no-op.
      - run: npm run build

      - run: npm test
